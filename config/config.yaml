# ---------------------------------------------------------------------------
# Calendar-Year Plan Loss Ratio Workbook â€” generator configuration
#
# This file defines STRUCTURE only. All actuarial inputs (loss ratios, rate
# logs, mods, seasonality weights) live in the generated workbooks' input
# tables and are maintained there by the team (brief Â§4).
#
# Dimensioning (user direction, DECISIONS.md D37): ONE WORKBOOK PER LINE OF
# BUSINESS; within each workbook, inputs are one row per BUSINESS UNIT x STATE.
#
# Regeneration workflow: edit this file (e.g., bump plan_year), rerun
#   python -m src.build_workbook --config config/config.yaml --out output/
# then paste your inputs into the new workbooks' tables (schemas are stable).
# ---------------------------------------------------------------------------

plan_year: 2027

business_units:
  - ABD
  - MM
  - SBA

# Rename to your actual writing states (sample list of 21; add/remove freely â€”
# table capacities scale automatically on regeneration).
states:
  - AZ
  - CO
  - DE
  - FL
  - GA
  - IA
  - IL
  - IN
  - KY
  - MD
  - MI
  - MN
  - NM
  - NC
  - OH
  - PA
  - SC
  - TN
  - VA
  - WV
  - WI

# One workbook is generated per LOB; term_months is that workbook's policy
# term (default 12; Inland Marine demonstrates the 6-month override, Â§10).
#
# `profile: light` (default "full") builds a trimmed workbook for a reader
# rather than an analyst: Portfolio, Scenarios, Solver, Attribution, Compare
# and One-Pager are not built, nor are the three hidden engine sections that
# exist only to serve them. Every number that remains is computed identically —
# the inputs, the engines, the exhibits and the Checks panel are untouched, and
# it verifies through phase D like any other file. It is ~13% smaller; the point
# is the tab strip, not the bytes.
lobs:
  - name: Property
  - name: General Liability
  - name: Commercial Auto
  - name: Workers Comp
  - name: Umbrella
  - name: Inland Marine
    term_months: 6

# Named 12-month written-weight profiles (Jan..Dec, relative weights) used to
# pre-fill sample rows of tbl_Seasonality (which is keyed by STATE in-book).
seasonality_profiles:
  coastal_renewals: [2.0, 0.6, 0.6, 0.8, 0.8, 1.0, 2.0, 0.8, 0.6, 0.6, 0.6, 1.6]

# Spare blank input rows kept beyond the seeded dimensions so a new state or
# late rate filings can be added without regenerating immediately.
#
# These also set how wide every log sweep is: the engine scans the whole
# capacity, not just the populated rows, so halving a capacity roughly halves
# that leg's scan cost. It is not worth tuning for speed (a full rebuild of the
# whole workbook is well under a second either way) — but do NOT trim below
# your real book's needs plus headroom for mid-season filings, because
# overflowing means regenerating in-season. Carry your inputs across with
# --carry-forward when you do change these.
table_capacity:
  spare_lr_rows: 37        # extra blank BU x State rows in tbl_LR (63 + 37 = 100)
  rate_log_rows: 400       # total tbl_RateLog rows (state x BU x changes)
  mod_log_rows: 200        # total tbl_ModLog rows (dated schedule-mod actions)
  spare_seasonality_rows: 3

output:
  lobs: all                # 'all' or a list of LOB names to generate
  directory: output
  filename: "Plan_LR_Workbook_{plan_year}_{lob}"

# classic (default): Excel-2007-era functions only — opens correctly on any
#   Excel build (and LibreOffice).
# modern (D113): the same arithmetic with LET — named intermediate steps make
#   the long formulas readable, at the cost of an Excel 2021+/M365 floor.
#   A modern build carries a Read Me banner + Checks FAIL that fire on older
#   Excel instead of showing stale values. Both dialects emit from one
#   template (xlstyle.let_) and are proven value-identical by
#   tools/ab_compare.py. Per-build override: --formula-mode / --tag.
formula_mode: classic

solver:
  max_reasonable_rate: 0.25    # |required change| beyond this triggers a warning
  min_post_share: 0.05         # post-effective earned share below this warns

theme:
  font: Calibri

# Version stamped on Read Me; bump when regenerating with structural changes.
version: 3.13.0
